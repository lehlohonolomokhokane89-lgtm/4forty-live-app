<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>4FORTY - LIVE</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
    body{background:#000;color:#fff}
    .header{background:#FFD700;color:#000;padding:12px;text-align:center;position:sticky;top:0;z-index:999}
    .live{width:10px;height:10px;background:red;border-radius:50%;display:inline-block;animation:blink 1s infinite}
    @keyframes blink{50%{opacity:0}}
    .tabs{display:flex;background:#111}
    .tabs button{flex:1;padding:12px;background:#111;color:#FFD700;border:none;font-weight:bold;cursor:pointer}
    .tabs button.active{background:#FFD700;color:#000}
    .tabs button:hover{opacity:0.8}
    .card{background:#111;border:1px solid #333;border-left:4px solid #FFD700;margin:10px;padding:12px;border-radius:10px}
    .gold{border-left-color:#FFD700;background:#1a1500}
    .btn{width:100%;padding:14px;background:#FFD700;color:#000;border:none;border-radius:8px;font-weight:bold;margin-top:8px;cursor:pointer}
    .btn:hover{opacity:0.9}
    .btn-green{background:#25D366;color:#fff}
    .btn-red{background:#d32f2f;color:#fff}
    input,select{width:100%;padding:12px;margin:6px 0;border-radius:8px;border:none}
    #map{height:300px;margin:10px;border-radius:10px}
    .route-chips{display:flex;overflow:auto;gap:8px;padding:10px}
    .chip{white-space:nowrap;padding:8px 14px;background:#222;border:1px solid #FFD700;border-radius:20px;color:#FFD700;cursor:pointer}
    .chip.active{background:#FFD700;color:#000}
    .chip:hover{opacity:0.8}
    .status{padding:10px;margin:8px 0;border-radius:8px;text-align:center}
    .status.error{background:#d32f2f;color:#fff}
    .status.success{background:#388e3c;color:#fff}
    .status.info{background:#1976d2;color:#fff}
    .otp-section{display:none}
    .hidden{display:none}
  </style>
</head>
<body>
  <div class="header">
    <h3>🚕 4FORTY <span class="live"></span> LIVE - Premium Taxi Service</h3>
    <small id="userPhone">Not logged in</small>
  </div>

  <div class="tabs">
    <button class="active" onclick="showTab('passenger')">PASSENGER</button>
    <button onclick="showTab('driver')">DRIVER</button>
    <button onclick="showTab('map')">MAP</button>
  </div>

  <!-- LOGIN MODAL -->
  <div class="card" id="loginCard">
    <h4>🇿🇦 Login with OTP</h4>
    <input id="phone" type="tel" placeholder="+27796230493" value="+27796230493">
    <button class="btn" onclick="requestOTP()">REQUEST OTP</button>
    
    <div class="otp-section" id="otpSection">
      <hr style="margin:12px 0;border:none;border-top:1px solid #333">
      <input id="otpCode" type="text" placeholder="Enter 6-digit OTP" maxlength="6">
      <button class="btn" onclick="verifyOTP()">VERIFY OTP</button>
      <button class="btn btn-red" onclick="cancelOTP()">CANCEL</button>
      <div id="otpStatus" style="margin-top:8px;color:#0f0"></div>
    </div>
  </div>

  <div class="route-chips" id="routeChips"></div>

  <!-- PASSENGER TAB -->
  <div id="passengerTab">
    <div class="card">
      <h4>📍 Book Taxi - Instant Confirmation</h4>
      <select id="fromRoute">
        <option>Ngwathe</option>
        <option>Parys</option>
        <option>Sasolburg</option>
        <option>Vanderbijlpark</option>
        <option>Johannesburg</option>
      </select>

      <select id="toRoute">
        <option>Johannesburg</option>
        <option>Sasolburg</option>
        <option>Parys</option>
        <option>Ngwathe</option>
      </select>

      <input id="pName" type="text" placeholder="Your name">
      <button class="btn" onclick="bookNow()">BOOK NOW - Driver calls you</button>
      <button class="btn btn-green" onclick="waBook()">💬 Share on WhatsApp</button>
      <div id="bookStatus" style="margin-top:8px"></div>
    </div>

    <div id="taxiList"></div>
  </div>

  <!-- DRIVER TAB -->
  <div id="driverTab" style="display:none">
    <div class="card gold">
      <h4>🚕 Driver Portal - GOLD Member (R100/month)</h4>
      
      <div id="driverLoginSection">
        <p style="margin:8px 0">Login to manage your taxi status</p>
        <button class="btn" onclick="switchToDriverLogin()">Login as Driver</button>
      </div>

      <div id="driverPanelSection" style="display:none">
        <input id="dPlate" type="text" placeholder="License Plate e.g. GP-01-ABC">
        <select id="dRoute">
          <option>Ngwathe - JHB</option>
          <option>Parys - JHB</option>
          <option>Sasolburg - JHB</option>
          <option>Ngwathe - Parys</option>
          <option>Ngwathe - Sasolburg</option>
        </select>
        
        <button class="btn" onclick="goLive()">🔴 GO LIVE - Show on map</button>
        <button class="btn btn-green" onclick="payGold()">💳 Pay GOLD R100 - WhatsApp</button>
        <button class="btn btn-red" onclick="logoutDriver()">Logout</button>
        <div id="driverStatus"></div>
      </div>
    </div>
  </div>

  <!-- MAP TAB -->
  <div id="mapTab" style="display:none">
    <div id="map"></div>
    <div class="card"><small>🟡 Yellow pins = Active GOLD taxis • Updates every 10s</small></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // ===== CONFIG =====
    const SUPABASE_URL = "https://YOURPROJECT.supabase.co";
    const SUPABASE_KEY = "sb_publishable_XXXXXXXXXXXXXXXXXXXXXXXX";
    const supa = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // ===== STATE =====
    let currentPhone = localStorage.getItem("phone") || "";
    let currentUserId = localStorage.getItem("userId") || "";
    let pendingOtpPhone = "";
    let map;
    let markers = [];
    let isDriver = false;

    const ROUTES = [
      "All",
      "Ngwathe-JHB",
      "Parys-JHB",
      "Sasolburg-JHB",
      "Ngwathe-Parys",
      "Ngwathe-Sasolburg",
      "Vanderbijlpark-JHB",
      "Parys-Sasolburg"
    ];

    // ===== INITIALIZATION =====
    function initChips() {
      const c = document.getElementById("routeChips");
      c.innerHTML = "";
      ROUTES.forEach(r => {
        const b = document.createElement("div");
        b.className = "chip";
        b.innerText = r;
        if (r === "All") b.classList.add("active");
        b.onclick = () => {
          document.querySelectorAll(".chip").forEach(x => x.classList.remove("active"));
          b.classList.add("active");
          loadTaxis(r);
        };
        c.appendChild(b);
      });
    }

    // ===== AUTHENTICATION =====
    async function requestOTP() {
      const phone = document.getElementById("phone").value.trim();
      if (!phone || phone.length < 10) {
        showOtpStatus("Enter valid phone number", "error");
        return;
      }

      pendingOtpPhone = phone;
      document.getElementById("otpSection").style.display = "block";
      showOtpStatus("✅ OTP sent to " + phone, "success");
      
      // In production, this would be handled by Supabase Auth or a backend function
      // For demo: any 6-digit code works
      console.log("Demo OTP: 123456");
    }

    async function verifyOTP() {
      const otpCode = document.getElementById("otpCode").value.trim();
      if (otpCode.length !== 6 || isNaN(otpCode)) {
        showOtpStatus("Enter 6-digit code", "error");
        return;
      }

      // Demo: Accept any 6-digit code
      // In production: validate against backend/Supabase Auth
      if (!/^\d{6}$/.test(otpCode)) {
        showOtpStatus("Invalid OTP", "error");
        return;
      }

      currentPhone = pendingOtpPhone;
      localStorage.setItem("phone", currentPhone);
      
      document.getElementById("userPhone").innerText = currentPhone + " | LIVE ✅";
      document.getElementById("loginCard").style.display = "none";
      document.getElementById("pName").value = "";
      
      loadTaxis("All");
      showOtpStatus("", "success");
    }

    function cancelOTP() {
      document.getElementById("otpSection").style.display = "none";
      document.getElementById("otpCode").value = "";
      showOtpStatus("", "info");
    }

    function showOtpStatus(msg, type) {
      const el = document.getElementById("otpStatus");
      el.innerText = msg;
      el.className = "status " + type;
    }

    function logout() {
      currentPhone = "";
      currentUserId = "";
      isDriver = false;
      localStorage.removeItem("phone");
      localStorage.removeItem("userId");
      document.getElementById("loginCard").style.display = "block";
      document.getElementById("userPhone").innerText = "Not logged in";
      document.getElementById("phone").value = "";
      document.getElementById("otpCode").value = "";
      document.getElementById("otpSection").style.display = "none";
    }

    // ===== TABS =====
    function showTab(tab) {
      document.querySelectorAll(".tabs button").forEach(b => b.classList.remove("active"));
      event.target.classList.add("active");

      document.getElementById("passengerTab").style.display = tab === "passenger" ? "block" : "none";
      document.getElementById("driverTab").style.display = tab === "driver" ? "block" : "none";
      document.getElementById("mapTab").style.display = tab === "map" ? "block" : "none";

      if (tab === "map") setTimeout(initMap, 200);
    }

    // ===== PASSENGER BOOKING =====
    async function loadTaxis(filter) {
      try {
        let q = supa.from("taxis").select("*").eq("is_gold", true).limit(90).order("updated_at", { ascending: false });

        if (filter && filter !== "All") {
          const key = filter.split("-")[0];
          q = q.ilike("route", "%" + key + "%");
        }

        const { data, error } = await q;
        if (error) throw error;

        const list = document.getElementById("taxiList");
        list.innerHTML = "";

        if (!data || data.length === 0) {
          list.innerHTML = "<div class='card'>No GOLD taxis available - Check back soon</div>";
          updateMapMarkers([]);
          return;
        }

        data.forEach(tx => {
          const d = document.createElement("div");
          d.className = "card gold";
          const timeAgo = Math.floor((Date.now() - new Date(tx.updated_at).getTime()) / 1000);
          const timeStr = timeAgo < 60 ? "now" : Math.floor(timeAgo / 60) + "m ago";
          d.innerHTML = `
            <b style="color:#FFD700">${tx.plate || "GOLD"} <span class="live"></span></b><br>
            <small>${tx.route || "Route"} • ${tx.driver || "Driver"} • Updated ${timeStr}</small><br>
            <button class="btn" onclick="callDriver('${tx.phone || "0796230493"}')">
              📞 CALL ${tx.plate}
            </button>
          `;
          list.appendChild(d);
        });

        updateMapMarkers(data);
      } catch (e) {
        console.log(e);
      }
    }

    async function bookNow() {
      if (!currentPhone) {
        alert("Please login first");
        return;
      }

      const from = document.getElementById("fromRoute").value;
      const to = document.getElementById("toRoute").value;
      const name = document.getElementById("pName").value.trim();

      if (!name) {
        alert("Enter your name");
        return;
      }

      try {
        const { error } = await supa.from("bookings").insert([{
          from_route: from,
          to_route: to,
          passenger_name: name,
          passenger_phone: currentPhone,
          created_at: new Date()
        }]);

        if (error) throw error;
        
        showBookingStatus("✅ Booking confirmed! Driver will call you shortly.", "success");
        setTimeout(() => waBook(), 1000);
      } catch (e) {
        showBookingStatus("Error: " + e.message, "error");
      }
    }

    function waBook() {
      const from = document.getElementById("fromRoute").value;
      const to = document.getElementById("toRoute").value;
      window.open(
        `https://wa.me/27796230493?text=4FORTY: ${from} to ${to} | ${currentPhone}`,
        "_blank"
      );
    }

    function showBookingStatus(msg, type) {
      const el = document.getElementById("bookStatus");
      el.innerText = msg;
      el.className = "status " + type;
    }

    function callDriver(phone) {
      window.location.href = `tel:${phone}`;
    }

    // ===== DRIVER MODE =====
    function switchToDriverLogin() {
      if (!currentPhone) {
        alert("Please login first");
        return;
      }
      document.getElementById("driverLoginSection").style.display = "none";
      document.getElementById("driverPanelSection").style.display = "block";
      isDriver = true;
    }

    async function goLive() {
      const plate = document.getElementById("dPlate").value.trim().toUpperCase();
      const route = document.getElementById("dRoute").value.trim();

      if (!plate || plate.length < 5) {
        showDriverStatus("Enter valid license plate", "error");
        return;
      }

      if (!currentPhone) {
        showDriverStatus("Not logged in", "error");
        return;
      }

      try {
        // Check if driver paid
        const { data: driverCheck } = await supa.from("drivers")
          .select("*")
          .eq("phone", currentPhone)
          .single();

        if (!driverCheck || !driverCheck.paid) {
          showDriverStatus("⚠️ GOLD membership required - Pay R100 first", "error");
          return;
        }

        // Update taxi with real location (demo: random within region)
        const { error } = await supa.from("taxis").upsert({
          plate,
          route,
          driver: currentPhone,
          phone: currentPhone,
          status: "LIVE",
          is_gold: true,
          lat: -26.8 + (Math.random() * 0.3 - 0.15),
          lng: 27.8 + (Math.random() * 0.3 - 0.15),
          updated_at: new Date()
        }, { onConflict: "plate" });

        if (error) throw error;

        showDriverStatus("✅ LIVE GOLD! Your taxi is on map now.", "success");
        loadTaxis("All");
      } catch (e) {
        showDriverStatus("Error: " + e.message, "error");
      }
    }

    function payGold() {
      const plate = document.getElementById("dPlate").value.trim().toUpperCase();
      if (!plate) {
        alert("Enter your plate first");
        return;
      }
      window.open(
        `https://wa.me/27796230493?text=4FORTY GOLD PAYMENT: Plate ${plate} | Phone ${currentPhone}`,
        "_blank"
      );
    }

    function logoutDriver() {
      isDriver = false;
      document.getElementById("driverLoginSection").style.display = "block";
      document.getElementById("driverPanelSection").style.display = "none";
      document.getElementById("dPlate").value = "";
      document.getElementById("driverStatus").innerText = "";
    }

    function showDriverStatus(msg, type) {
      const el = document.getElementById("driverStatus");
      el.innerText = msg;
      el.className = "status " + type;
    }

    // ===== MAP =====
    function initMap() {
      if (map) return;
      map = L.map("map").setView([-26.8, 27.8], 9);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: "© OpenStreetMap",
        maxZoom: 18
      }).addTo(map);
      loadTaxis("All");
    }

    function updateMapMarkers(data) {
      if (!map) return;
      markers.forEach(m => map.removeLayer(m));
      markers = [];

      data.forEach(tx => {
        if (tx.lat && tx.lng) {
          const m = L.marker([tx.lat, tx.lng], {
            title: tx.plate
          }).addTo(map).bindPopup(`<b>${tx.plate}</b><br>${tx.route}<br>📞 ${tx.phone}`);
          markers.push(m);
        }
      });
    }

    // ===== STARTUP =====
    initChips();
    
    if (currentPhone) {
      document.getElementById("loginCard").style.display = "none";
      document.getElementById("userPhone").innerText = currentPhone + " | LIVE ✅";
      loadTaxis("All");
    } else {
      loadTaxis("All");
    }

    // Refresh taxis every 10s
    setInterval(() => {
      if (!isDriver) {
        const active = document.querySelector(".chip.active")?.innerText || "All";
        loadTaxis(active);
      }
    }, 10000);
  </script>
</body>
</html>
